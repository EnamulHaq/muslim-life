name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android Project
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename and Prepare APKs
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="latest"
          fi
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk release-assets/MuslimLife-${TAG_NAME}-arm64.apk || true
          cp android/app/build/outputs/apk/release/app-universal-release.apk release-assets/MuslimLife-${TAG_NAME}-universal.apk || true
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-assets/MuslimLife-${TAG_NAME}-armv7.apk || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
